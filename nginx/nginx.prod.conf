worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss image/svg+xml font/woff2;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream fastapi {
        server web:8000;
    }

    # HTTP → HTTPS redirect (all domains)
    server {
        listen 80;
        server_name sisuu.com www.sisuu.com;
        return 301 https://sisuu.com$request_uri;
    }

    # www → apex redirect on HTTPS
    server {
        listen 443 ssl http2;
        server_name www.sisuu.com;

        ssl_certificate     /etc/letsencrypt/live/sisuu.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sisuu.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://sisuu.com$request_uri;
    }

    # Primary HTTPS server
    server {
        listen 443 ssl http2;
        server_name sisuu.com;

        ssl_certificate     /etc/letsencrypt/live/sisuu.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sisuu.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        autoindex off;
        client_max_body_size 10m;

        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
