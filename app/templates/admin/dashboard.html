{% extends "admin/base.html" %}
{% set active = "dashboard" %}
{% block page_title %}仪表盘{% endblock %}
{% block content %}
<div class="row g-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center">
                <h2 class="display-6 text-primary">{{ tool_count }}</h2>
                <p class="text-secondary mb-0">工具数量</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center">
                <h2 class="display-6 text-primary">{{ blog_count }}</h2>
                <p class="text-secondary mb-0">文章数量</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center">
                <h2 class="display-6 text-primary">{{ category_count }}</h2>
                <p class="text-secondary mb-0">工具分类</p>
            </div>
        </div>
    </div>
</div>
<div class="alert alert-info mt-4">
    后台基础功能已就绪。工具/文章数据当前使用 Seed 数据，数据库 CRUD 将在后续版本完善。
</div>
{% endblock %}
