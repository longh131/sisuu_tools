{% extends "admin/base.html" %}
{% set active = "tools" %}
{% block page_title %}工具管理{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>名称</th>
                    <th>Slug</th>
                    <th>分类</th>
                    <th>类型</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for tool in tools %}
                <tr>
                    <td>{{ tool.name }}</td>
                    <td><code>{{ tool.slug }}</code></td>
                    <td>{{ tool.category }}</td>
                    <td>{% if tool.is_ai %}AI{% else %}工具{% endif %}</td>
                    <td><span class="badge bg-success">上架</span></td>
                    <td><a href="/tools/{{ tool.slug }}" target="_blank" class="btn btn-sm btn-outline-primary">预览</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
