{% extends "admin/base.html" %}
{% set active = "blog" %}
{% block page_title %}文章管理{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr><th>标题</th><th>Slug</th><th>分类</th><th>操作</th></tr>
            </thead>
            <tbody>
                {% for post in posts %}
                <tr>
                    <td>{{ post.title }}</td>
                    <td><code>{{ post.slug }}</code></td>
                    <td>{{ post.category }}</td>
                    <td><a href="/blog/{{ post.slug }}" target="_blank" class="btn btn-sm btn-outline-primary">预览</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
