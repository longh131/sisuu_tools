{% extends "admin/base.html" %}
{% set active = "blog" %}
{% block page_title %}{% if post %}编辑文章{% else %}新增文章{% endif %}{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="post" action="/admin/blog/save">
            {% if post %}<input type="hidden" name="post_id" value="{{ post.id }}">{% endif %}
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">标题</label>
                    <input class="form-control" name="title" required value="{{ post.title if post else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Slug</label>
                    <input class="form-control" name="slug" required value="{{ post.slug if post else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">摘要</label>
                    <textarea class="form-control" name="summary" rows="2">{{ post.summary if post else '' }}</textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">正文 (HTML)</label>
                    <textarea class="form-control font-monospace" name="content" rows="12">{{ post.content if post else '' }}</textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label">分类</label>
                    <input class="form-control" name="category" value="{{ post.category if post else '' }}">
                </div>
                <div class="col-md-8">
                    <label class="form-label">标签 (逗号分隔)</label>
                    <input class="form-control" name="tags" value="{{ post.tags if post else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">SEO Title</label>
                    <input class="form-control" name="seo_title" value="{{ post.seo_title if post else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">SEO Description</label>
                    <input class="form-control" name="seo_description" value="{{ post.seo_description if post else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-check"><input class="form-check-input" type="checkbox" name="publish" value="true" {% if post and post.published_at %}checked{% endif %}> 立即发布</label>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/admin/blog" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
