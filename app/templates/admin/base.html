<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}仪表盘{% endblock %} — 后台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #0F172A; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 10px 16px; display: block; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #2563EB; }
        .sidebar .brand { color: #fff; font-weight: 700; padding: 16px; border-bottom: 1px solid #1e293b; }
        .sidebar .section { color: #64748b; font-size: 0.75rem; padding: 12px 16px 4px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="brand">{{ app_name }}</div>
                <nav>
                    <a href="/admin/" class="{% if active == 'dashboard' %}active{% endif %}">仪表盘</a>
                    <div class="section">内容</div>
                    <a href="/admin/tools" class="{% if active == 'tools' %}active{% endif %}">工具管理</a>
                    <a href="/admin/blog" class="{% if active == 'blog' %}active{% endif %}">文章管理</a>
                    <div class="section">运营</div>
                    <a href="/admin/users" class="{% if active == 'users' %}active{% endif %}">用户管理</a>
                    <a href="/admin/leads" class="{% if active == 'leads' %}active{% endif %}">Email Leads</a>
                    <a href="/admin/payments" class="{% if active == 'payments' %}active{% endif %}">支付 / 订阅</a>
                    <div class="section">系统</div>
                    <a href="/admin/settings" class="{% if active == 'settings' %}active{% endif %}">系统设置</a>
                    <a href="/" target="_blank">查看前台 ↗</a>
                    <a href="/admin/logout">退出登录</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between mb-4">
                    <h4 class="mb-0">{% block page_title %}仪表盘{% endblock %}</h4>
                    <span class="text-secondary">欢迎，{{ admin_user }}</span>
                </div>
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
