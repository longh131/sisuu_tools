{% extends "base.html" %}

{% block content %}
<section class="section-py bg-white">
    <div class="container">
        <h1 class="section-title fw-bold mb-3">{{ page_h1 }}</h1>
        <div class="page-content text-secondary">
            {{ page_content | safe }}
        </div>
        {% if back_url %}
        <a href="{{ back_url }}" class="btn btn-outline-primary mt-4">{{ back_label | default('Go Back') }}</a>
        {% endif %}
    </div>
</section>
{% endblock %}
