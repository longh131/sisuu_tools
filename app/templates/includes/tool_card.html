{# Reusable tool card — per docs/06 §七 #}
<div class="col-md-6 col-lg-4 col-xl-3">
    <div class="card tool-card h-100">
        <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div class="tool-card-icon">
                    <i data-lucide="{{ tool.icon }}" class="icon-md text-primary"></i>
                </div>
                <div class="d-flex gap-1">
                    {% if tool.is_ai %}
                    <span class="badge bg-primary">AI</span>
                    {% endif %}
                    <span class="badge bg-success-subtle text-success">Free</span>
                </div>
            </div>
            <h3 class="card-title h6 fw-semibold">{{ tool.name }}</h3>
            <p class="card-text text-secondary small flex-grow-1">{{ tool.description }}</p>
            {% if tool.category_name or tool.category %}
            <p class="text-muted small mb-2">{{ (tool.category_name or tool.category) | replace('-', ' ') | title }}</p>
            {% endif %}
            <a href="/tools/{{ tool.slug }}" class="btn btn-primary btn-sm mt-auto align-self-start">
                Open Tool
            </a>
        </div>
    </div>
</div>
