{# Reusable category card component #}
<div class="col-md-6 col-lg-3">
    <a href="/tools/{{ category.slug }}" class="text-decoration-none">
        <div class="card category-card h-100">
            <div class="card-body text-center">
                <div class="category-card-icon mb-3">
                    <i data-lucide="{{ category.icon }}" class="icon-lg text-primary"></i>
                </div>
                <h3 class="card-title h5 fw-semibold text-dark">{{ category.name }}</h3>
                <p class="card-text text-secondary small">{{ category.description }}</p>
            </div>
        </div>
    </a>
</div>
