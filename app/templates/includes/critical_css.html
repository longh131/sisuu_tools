{# Critical above-the-fold CSS — allows async Bootstrap load #}
<style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#0f172a;background:#fff;min-height:100vh;display:flex;flex-direction:column}
    #main-content{flex:1}
    .container{width:100%;max-width:1200px;margin:0 auto;padding:0 12px}
    .row{display:flex;flex-wrap:wrap;margin:0 -12px}
    .col-lg-6,.col-12{padding:0 12px;width:100%}
    @media(min-width:992px){.col-lg-6{width:50%}}
    .d-flex{display:flex}.flex-wrap{flex-wrap:wrap}.gap-3{gap:1rem}.align-items-center{align-items:center}
    .py-5{padding-top:3rem;padding-bottom:3rem}.py-4{padding-top:1.5rem;padding-bottom:1.5rem}
    .mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:1rem}.mb-4{margin-bottom:1.5rem}
    .fw-bold{font-weight:700}.fw-medium{font-weight:500}.text-primary{color:#2563eb}
    .text-secondary{color:#475569}.btn{display:inline-block;padding:.5rem 1rem;border-radius:8px;text-decoration:none;border:1px solid transparent;cursor:pointer}
    .btn-primary{background:#2563eb;color:#fff}.btn-outline-primary{background:transparent;color:#2563eb;border-color:#2563eb}
    .hero-title{font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.2}
    .hero-subtitle{font-size:1.125rem;color:#475569}
    .site-header .navbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid #e5e7eb;background:#fff}
    .navbar-brand{font-size:1.25rem;text-decoration:none;color:#0f172a}
    .navbar-nav{display:none;list-style:none;margin:0;padding:0;gap:1rem}
    @media(min-width:992px){.navbar-nav{display:flex}}
    .nav-link{text-decoration:none;color:#0f172a;padding:.5rem 0}
</style>
